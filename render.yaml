services:
  - type: web
    name: ammarbuilds-leadgen
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_PATH
        value: /data/leads.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
